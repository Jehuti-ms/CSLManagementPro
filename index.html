<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CSL Management Pro</title>

    <!-- ===== FAVICONS ===== -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    
    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileColor" content="#1A1A2E">
    <meta name="msapplication-TileImage" content="mstile-150x150.png">
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#6C63FF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- ===== SEO / Social ===== -->
    <meta name="description" content="Service Club Management Platform - Track attendance, activities, and reflections.">
    <meta property="og:title" content="CSL Management Pro">
    <meta property="og:description" content="Service Club Management Platform">
    <meta property="og:type" content="website">
    
    <!-- ===== FIREBASE SDKs ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    
    <!-- ===== FONT AWESOME ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- ===== GOOGLE FONTS ===== -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- ===== CUSTOM CSS ===== -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/tracker.css">
    <link rel="stylesheet" href="css/reflections.css">
</head>
<body>
<div class="app-container" id="app">
    
    <!-- ===== HEADER ===== -->
    <header class="app-header">
        <div class="header-left">
            <h1>
                <i class="fas fa-hands-helping"></i> 
                CSL Management Pro
                <span class="premium-badge">Premium</span>
            </h1>
        </div>
        
        <div class="header-right">
                <!-- Desktop Navigation (Hidden on mobile via CSS) -->
                <div class="nav-tabs hide-on-mobile" id="navTabs" style="display: none;">
        
                <button class="nav-tab" data-page="landing">
                    <i class="fas fa-home"></i> Home
                </button>
                <button class="nav-tab active" data-page="attendance">
                    <i class="fas fa-clipboard-list"></i> Attendance
                </button>
                <button class="nav-tab" data-page="tracker">
                    <i class="fas fa-chart-line"></i> Tracker
                </button>
                <button class="nav-tab" data-page="reflections">
                    <i class="fas fa-comment-dots"></i> Reflections
                </button>
                <button class="nav-tab" data-page="student">
                    <i class="fas fa-user-graduate"></i> Student
                </button>
                <button class="nav-tab" data-page="adminprofile">
                    <i class="fas fa-user-cog"></i> Profile
                </button>
                <button class="nav-tab" data-page="admin">
                    <i class="fas fa-users-cog"></i> Manage
                </button>
            </div>
            
            <!-- User Badge -->
            <div class="user-badge" id="userBadge" style="display: none;">
                <div class="avatar">T</div>
                <span id="userEmail">teacher@demo.com</span>
                <button class="btn-logout" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- ===== NAV OVERLAY (for closing menu on click outside) ===== -->
    <div id="mobileOverlay" class="mobile-overlay" style="display: none;"></div>

    <!-- ===== PAGE CONTAINER (ONLY ONE!) ===== -->
    <div id="pageContainer">
        <!-- Pages will be loaded dynamically -->
    </div>

   <!-- ===== MOBILE BOTTOM NAVIGATION ===== -->
    <nav class="mobile-bottom-nav" id="mobileBottomNav" style="display: none;">
        <div class="nav-items" id="mobileNavItems">
            <!-- Buttons will be injected here dynamically based on user role -->
        </div>
    </nav>

    <!-- ===== MOBILE TOAST ===== -->
    <div id="mobileToast" class="toast-mobile">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Success!</span>
    </div>
</div>

<!-- ===== JAVASCRIPT - Load in order ===== -->
<script src="js/config/firebase-config.js"></script>
<script src="js/services/database.js"></script>
<script src="js/auth/auth.js"></script>
<script src="js/pages/login.js"></script>
<script src="js/pages/landing.js"></script>
<script src="js/pages/adminLogin.js"></script>
<script src="js/pages/adminProfile.js"></script>
<script src="js/pages/attendance.js"></script>
<script src="js/pages/tracker.js"></script>
<script src="js/pages/reflections.js"></script>
<script src="js/pages/student.js"></script> 
<script src="js/pages/admin.js"></script>
<script src="js/app.js"></script>

<!-- ===== EMERGENCY MOBILE NAV FIX ===== -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    console.log("🔧 Emergency mobile nav loaded");
    
    // Get elements
    var menuToggle = document.getElementById('mobileMenuToggle');
    var navTabs = document.getElementById('navTabs');
    var overlay = document.getElementById('mobileOverlay');
    
    console.log("menuToggle:", menuToggle);
    console.log("navTabs:", navTabs);
    console.log("overlay:", overlay);
    
    if (!menuToggle || !navTabs) {
        console.warn("⚠️ Required elements not found for mobile nav");
        return;
    }
    
    // Function to close menu
    function closeMobileMenu() {
        navTabs.classList.remove('open');
        if (overlay) {
            overlay.classList.remove('active');
            overlay.style.display = 'none';
        }
        var icon = menuToggle.querySelector('i');
        if (icon) {
            icon.className = 'fas fa-bars';
        }
        document.body.style.overflow = '';
        console.log("📋 Emergency: Menu closed");
    }
    
    // Function to open menu
    function openMobileMenu() {
        navTabs.classList.add('open');
        if (overlay) {
            overlay.classList.add('active');
            overlay.style.display = 'block';
        }
        var icon = menuToggle.querySelector('i');
        if (icon) {
            icon.className = 'fas fa-times';
        }
        document.body.style.overflow = 'hidden';
        console.log("📋 Emergency: Menu opened");
    }
    
    // Toggle menu on hamburger click
    menuToggle.addEventListener('click', function(e) {
        e.stopPropagation();
        e.preventDefault();
        
        console.log("📱 Emergency: Hamburger clicked");
        
        if (navTabs.classList.contains('open')) {
            closeMobileMenu();
        } else {
            openMobileMenu();
        }
    });
    
    // Close menu when clicking overlay
    if (overlay) {
        overlay.addEventListener('click', function() {
            if (navTabs.classList.contains('open')) {
                closeMobileMenu();
            }
        });
    }
    
    // Close menu when clicking a nav item
    var navItems = document.querySelectorAll('.nav-tab');
    navItems.forEach(function(item) {
        item.addEventListener('click', function() {
            if (navTabs.classList.contains('open')) {
                closeMobileMenu();
            }
        });
    });
    
    // Close menu when clicking outside
    document.addEventListener('click', function(e) {
        if (navTabs.classList.contains('open')) {
            if (!navTabs.contains(e.target) && !menuToggle.contains(e.target)) {
                closeMobileMenu();
            }
        }
    });
    
    // Close menu on Escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && navTabs.classList.contains('open')) {
            closeMobileMenu();
        }
    });
    
    // Close menu on window resize (desktop)
    window.addEventListener('resize', function() {
        if (window.innerWidth > 768 && navTabs.classList.contains('open')) {
            closeMobileMenu();
        }
    });
    
    // Mobile bottom nav - forward clicks to app
    var bottomNavItems = document.querySelectorAll('.mobile-bottom-nav .nav-item');
    bottomNavItems.forEach(function(item) {
        item.addEventListener('click', function() {
            var page = this.dataset.page;
            console.log("📱 Emergency: Bottom nav clicked:", page);
            
            // Close mobile menu
            if (navTabs.classList.contains('open')) {
                closeMobileMenu();
            }
            
            // Navigate using app
            if (window.app && window.app.navigateTo) {
                window.app.navigateTo(page);
            }
        });
    });
    
    console.log("✅ Emergency mobile nav setup complete");
});
</script>
</body>
</html>
