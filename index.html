<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSL Management Pro</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/tracker.css"> 
</head>
<body>
<div class="app-container" id="app">
    <!-- ===== HEADER ===== -->
    <div class="app-header">
        <h1><i class="fas fa-hands-helping"></i> CSL Management Pro</h1>
        <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
            <div class="nav-tabs" id="navTabs" style="display: none;">
                <button class="nav-tab active" data-page="attendance"><i class="fas fa-clipboard-list"></i> Attendance</button>
                <button class="nav-tab" data-page="tracker"><i class="fas fa-chart-line"></i> Tracker</button>
                <button class="nav-tab" data-page="reflections"><i class="fas fa-pen-fancy"></i> Reflections</button>
                <button class="nav-tab" data-page="admin"><i class="fas fa-user-cog"></i> Admin</button>
            </div>
            <div class="user-badge" id="userBadge" style="display: none;">
                <i class="fas fa-user-circle"></i>
                <span id="userEmail">teacher@demo.com</span>
                <button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
    </div>

    <!-- ===== PAGE CONTAINER ===== -->
    <div id="pageContainer">
        <!-- Pages will be loaded dynamically -->
    </div>
</div>

<!-- JavaScript - Load in order -->
<script src="js/config/firebase-config.js"></script>
<script src="js/services/database.js"></script>
<script src="js/auth/auth.js"></script>
<script src="js/pages/login.js"></script>
<script src="js/pages/attendance.js"></script>
<script src="js/pages/tracker.js"></script>
<script src="js/pages/reflections.js"></script>
<script src="js/pages/admin.js"></script>
<script src="js/app.js"></script>

    <script>
// Emergency fix - render login directly
document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('pageContainer');
    if (container && container.innerHTML === '') {
        console.log("🆘 Emergency login render");
        container.innerHTML = `
            <div style="max-width:440px;margin:40px auto;padding:48px 40px;background:white;border-radius:20px;box-shadow:0 20px 60px rgba(108,99,255,0.15);text-align:center;">
                <div style="font-size:3rem;color:#6C63FF;margin-bottom:8px;"><i class="fas fa-hands-helping"></i></div>
                <h2 style="margin-bottom:8px;color:#1A1A2E;font-size:2rem;font-weight:800;">Welcome Back</h2>
                <p style="color:#6C7A89;margin-bottom:32px;">Sign in to manage your service clubs</p>
                
                <div style="position:relative;margin-bottom:16px;">
                    <i class="fas fa-envelope" style="position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#6C7A89;"></i>
                    <input type="email" id="emergencyEmail" placeholder="Email address" value="dmoseley@gams.edu.bb" style="width:100%;padding:14px 18px 14px 48px;border:2px solid #E8ECF1;border-radius:12px;font-size:1rem;">
                </div>
                <div style="position:relative;margin-bottom:16px;">
                    <i class="fas fa-lock" style="position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#6C7A89;"></i>
                    <input type="password" id="emergencyPassword" placeholder="Password" style="width:100%;padding:14px 18px 14px 48px;border:2px solid #E8ECF1;border-radius:12px;font-size:1rem;">
                </div>
                <button id="emergencyLoginBtn" style="width:100%;padding:14px;background:linear-gradient(135deg,#6C63FF,#5A52D5);border:none;border-radius:12px;color:white;font-weight:700;font-size:1rem;cursor:pointer;">
                    <i class="fas fa-arrow-right-to-bracket"></i> Sign in
                </button>
                <div id="emergencyError" style="color:#FF6B6B;margin-top:12px;"></div>
                <div style="margin-top:16px;font-size:0.85rem;color:#6C7A89;">
                    <i class="fas fa-info-circle"></i> Demo: teacher@demo.com / 123456
                </div>
            </div>
        `;
        
        document.getElementById('emergencyLoginBtn').addEventListener('click', function() {
            const email = document.getElementById('emergencyEmail').value;
            const password = document.getElementById('emergencyPassword').value;
            const errorEl = document.getElementById('emergencyError');
            
            if (email && password && password.length >= 6) {
                errorEl.textContent = '✅ Login successful! (mock mode)';
                document.getElementById('navTabs').style.display = 'flex';
                document.getElementById('userBadge').style.display = 'flex';
                document.getElementById('userEmail').textContent = email;
                document.getElementById('pageContainer').innerHTML = '<div style="padding:40px;text-align:center;"><h2>Welcome!</h2><p>You are now logged in.</p></div>';
            } else {
                errorEl.textContent = '⚠️ Please enter email and password (6+ chars)';
            }
        });
    }
});
</script>
</body>
</html>
