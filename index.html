<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Club Manager</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Tail Winds -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-container" id="app">
    <!-- Header -->
    <div class="app-header">
        <h1><i class="fas fa-hands-helping"></i> ClubManager</h1>
        <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
            <div class="nav-tabs" id="navTabs">
                <button class="nav-tab active" data-page="attendance"><i class="fas fa-clipboard-list"></i> Attendance</button>
                <button class="nav-tab" data-page="tracker"><i class="fas fa-chart-line"></i> Tracker</button>
                <button class="nav-tab" data-page="reflections"><i class="fas fa-pen-fancy"></i> Reflections</button>
                <button class="nav-tab" data-page="admin"><i class="fas fa-user-cog"></i> Admin</button>
            </div>
            <div class="user-badge" id="userBadge">
                <i class="fas fa-user-circle" style="font-size: 1.4rem; color:#2a7de1;"></i>
                <span id="userEmail">teacher@demo.com</span>
                <button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
    </div>

    <!-- Page Container - Pages are loaded here -->
    <div id="pageContainer">
        <!-- Pages will be loaded dynamically -->
    </div>
</div>

<!-- JavaScript - Load in order -->
<script src="js/config/firebase-config.js"></script>
<script src="js/services/database.js"></script>
<script src="js/auth/auth.js"></script>
<script src="js/pages/attendance.js"></script>
<script src="js/pages/tracker.js"></script>
<script src="js/pages/reflections.js"></script>
<script src="js/pages/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
